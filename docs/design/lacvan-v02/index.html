const faqItems=[['Làm thế nào để gửi yêu cầu tư vấn?','How can I request a consultation?','Bạn có thể để lại số điện thoại hoặc email trong biểu mẫu. Phòng khám sẽ liên hệ trao đổi bước tiếp theo; gửi yêu cầu chưa phải lịch hẹn đã được xác nhận.','Leave your phone number or email in the form. The clinic will contact you to discuss the next step; a request is not a confirmed appointment.'],['Tôi cần chuẩn bị gì cho lần thăm khám đầu?','What should I prepare for my first visit?','Hãy mang thông tin chăm sóc trước đây nếu có và ghi lại những điều bạn muốn hỏi. Bạn có thể trao đổi trước về thời gian, ngôn ngữ và những hỗ trợ cần thiết.','Bring previous care information if available and write down your questions. You can ask about timing, language and any support you need.'],['Tôi có được trao đổi chi phí trước khi quyết định không?','Can I discuss fees before making a decision?','Bác sĩ và phòng khám sẽ giải thích các hạng mục, phạm vi và điều kiện trong kế hoạch cá nhân. Bảng giá trên website mang tính tham khảo.','The dentist and clinic will explain the items, scope and conditions of your individual plan. Website fees are indicative.'],['Lạc Vân có tư vấn bằng tiếng Anh không?','Is English-language consultation available?','Bạn có thể chọn English khi gửi yêu cầu. Phòng khám sẽ trao đổi để sắp xếp người và thời gian phù hợp.','Choose English when sending your request. The clinic will discuss suitable arrangements and timing.'],['Tôi có thể chọn cơ sở mình muốn đến không?','Can I choose the clinic I would like to visit?','Có. Hãy chọn cơ sở bạn quan tâm trong biểu mẫu. Phòng khám sẽ kiểm tra thông tin và trao đổi với bạn trước khi xác nhận.','Yes. Select your preferred clinic in the form. The clinic will check the details and discuss them before confirming.']];
function serviceName(s){return T(s.vi,s.en)}
function doctorRole(d){return T(d.roleVi,d.roleEn)}
function catName(id){const c=categories.find(c=>c.id===id)||categories[0];return T(c.vi,c.en)}
function serviceCard(s,index=0){return `<a href="#/service/${s.id}" class="service-card"><span class="service-number">0${index+1}</span>${picture(s.image,serviceName(s))}<div class="card-body"><span class="eyebrow" style="font-size:8px;margin-bottom:10px">${T(s.tagVi,s.tagEn)}</span><h3>${serviceName(s)}</h3><p>${T(s.descVi,s.descEn)}</p><span class="text-link">${T('Tìm hiểu thêm','Explore this service')}${icon('arrow',17)}</span></div></a>`}
function doctorCard(d){return `<a href="#/doctor/${d.id}" class="doctor-card"><div class="doctor-portrait">${picture(d.image,T('Chân dung bác sĩ ','Portrait of Dr ')+d.name)}<span class="doctor-tag">${T('LẮNG NGHE · THẤU HIỂU · ĐỒNG HÀNH','LISTEN · UNDERSTAND · CARE')}</span></div><h3>${T('BS. ','Dr ')}${d.name}</h3><p>${doctorRole(d)}</p><span class="text-link">${T('Gặp gỡ bác sĩ','Meet your dentist')}${icon('arrow',15)}</span></a>`}
function articleCard(a){return `<article class="article-card"><a href="#/article/${a.id}">${picture(a.image,T(a.vi,a.en))}<span class="tag">${catName(a.category)}</span><h3>${T(a.vi,a.en)}</h3></a><p>${T(a.descVi,a.descEn)}</p>${link(T('Đọc bài viết','Read the story'),'article/'+a.id)}</article>`}
function locationCard(l){return `<article class="location-card"><a href="#/location/${l.id}">${picture(l.image,T(l.name,l.en))}</a><div><span class="eyebrow" style="font-size:8px;margin-bottom:10px">${T('KHÔNG GIAN CỦA BẠN','YOUR SPACE')}</span><h3><a href="#/location/${l.id}">${T(l.name,l.en)}</a></h3><p>${T(l.address,l.addressEn)}</p><p>${T('Thứ 2–Thứ 7 · 08:00–12:00, 13:30–18:00','Mon–Sat · 08:00–12:00, 13:30–18:00')}</p>${link(T('Khám phá cơ sở','Explore this clinic'),'location/'+l.id)}</div></article>`}
function storyCard(s){return `<article class="story-card"><a href="#/story/${s.id}">${picture(s.image,T('Chân dung ','Portrait of ')+s.name)}</a><div><span class="category-kicker">${s.name}</span><h3><a href="#/story/${s.id}">${T(s.titleVi,s.titleEn)}</a></h3><p>${T('Một câu chuyện minh họa về sự lắng nghe và những lựa chọn trong buổi tư vấn.','An illustrative story about listening and choices during a consultation.')}</p>${link(T('Đọc câu chuyện','Read the story'),'story/'+s.id)}</div></article>`}
function checklist(items){return `<ul class="check-list">${items.map(s=>`<li>${icon('check',17)}<span>${s}</span></li>`).join('')}</ul>`}
function faq(items=faqItems){return `<div class="faq-list">${items.map(x=>`<details class="faq-item"><summary>${T(x[0],x[1])}</summary><div class="answer">${T(x[2],x[3])}</div></details>`).join('')}</div>`}
function values(){return `<section class="values-band"><div class="container grid-3">${[['heart',T('Lắng nghe trước tiên','Listen first'),T('Dành đủ thời gian để hiểu mong muốn và những điều bạn còn băn khoăn.','Make time to understand your goals and the questions on your mind.')],['shield',T('Giải thích rõ ràng','Explain clearly'),T('Trao đổi về lựa chọn, phạm vi và chi phí trước khi cùng bạn quyết định.','Discuss options, scope and fees before deciding together.')],['leaf',T('Đồng hành từng bước','Care along the way'),T('Giữ kết nối để bạn chủ động hơn với kế hoạch chăm sóc của mình.','Stay connected so you can take an active part in your care plan.')]].map(x=>`<div class="value-item">${icon(x[0],32)}<div><h3>${x[1]}</h3><p>${x[2]}</p></div></div>`).join('')}</div></section>`}
function compactForm(){return `<section class="container consult-strip"><h2>${T('Bắt đầu bằng một','Start with a')}<br><span>${T('cuộc trò chuyện','conversation')}</span></h2><form class="prototype-form" data-form="compact"><label class="sr-label field"><span hidden>${T('Họ tên','Name')}</span><input name="name" autocomplete="off" placeholder="${T('Họ và tên','Your name')}" aria-label="${T('Họ tên','Name')}"></label><label class="field"><span hidden>${T('Số điện thoại','Phone')}</span><input name="phone" type="tel" autocomplete="off" placeholder="${T('Số điện thoại','Phone number')}" aria-label="${T('Số điện thoại','Phone')}" required></label><label class="field"><span hidden>Email</span><input name="email" type="email" autocomplete="off" placeholder="Email" aria-label="Email"></label><button class="btn" type="submit">${T('Gửi yêu cầu','Send request')}${icon('arrow',16)}</button><label class="consent"><input name="consent" type="checkbox" required><span>${T('Tôi đồng ý để phòng khám liên hệ tư vấn theo yêu cầu này. Yêu cầu chưa phải lịch hẹn đã xác nhận.','I agree to be contacted about this request. This is not a confirmed appointment.')}</span></label><div class="form-result" role="status" hidden></div></form></section>`}
function inquiry(id='consultation'){return `<section class="section" id="${id}"><div class="container"><div class="inquiry-panel"><div class="inquiry-visual">${picture('hero-wellbeing',T('Khoảnh khắc an nhiên trong không gian sáng dịu','A calm moment in a softly lit space'))}<div class="inquiry-copy"><span class="eyebrow" style="color:#f0cce3">${T('DÀNH THỜI GIAN CHO BẠN','MAKE TIME FOR YOU')}</span><h2>${T('Nụ cười khỏe.<br>Tâm thế an nhiên.','A healthy smile.<br>A calmer state of mind.')}</h2><p>${T('Chúng tôi ở đây để lắng nghe. Hãy bắt đầu bằng điều bạn đang quan tâm.','We are here to listen. Let’s start with what matters to you.')}</p></div></div><div class="inquiry-form"><h3>${T('Kết nối cùng Lạc Vân','Connect with Lạc Vân')}</h3><p class="fine">${T('Để lại thông tin thuận tiện. Phòng khám sẽ trao đổi với bạn trước khi xác nhận lịch hẹn.','Leave a convenient contact method. The clinic will talk with you before confirming an appointment.')}</p><form class="prototype-form"><div class="form-grid"><label class="field full">${T('Họ và tên','Your name')}<input name="name" autocomplete="off" placeholder="${T('Bạn muốn chúng tôi gọi thế nào?','How would you like to be addressed?')}"></label><label class="field">${T('Số điện thoại','Phone number')}<input name="phone" type="tel" autocomplete="off" placeholder="${T('Số liên hệ','Phone number')}"></label><label class="field">Email<input name="email" type="email" autocomplete="off" placeholder="you@example.com"></label><label class="field">${T('Cơ sở quan tâm','Preferred clinic')}<select name="clinic"><option value="">${T('Chưa chọn cơ sở','No preference')}</option>${locations.map(l=>`<option>${T(l.name,l.en)}</option>`).join('')}</select></label><label class="field">${T('Ngôn ngữ tư vấn','Consultation language')}<select name="language"><option value="vi"${locale==='vi'?' selected':''}>Tiếng Việt</option><option value="en"${locale==='en'?' selected':''}>English</option></select></label><label class="field full">${T('Điều bạn muốn trao đổi','What would you like to discuss?')}<textarea name="message" rows="3" maxlength="500" placeholder="${T('Chia sẻ ngắn gọn mong muốn của bạn','Briefly share what is on your mind')}"></textarea><span class="fine">${T('Không gửi hồ sơ sức khỏe hoặc bệnh án qua biểu mẫu này.','Please do not include medical records in this form.')}</span></label><label class="consent full"><input type="checkbox" name="consent" required><span>${T('Tôi đồng ý để phòng khám sử dụng thông tin đã cung cấp để liên hệ tư vấn theo yêu cầu này.','I agree that the clinic may use the information provided to contact me about this request.')}</span></label></div><button class="btn" type="submit">${T('Gửi yêu cầu tư vấn','Request a consultation')}${icon('arrow',18)}</button><div class="form-result" role="status" hidden></div></form></div></div></div></section>`}
function aside(){return `<aside class="article-aside"><div class="aside-card">${picture('facility-consultation-lounge',T('Không gian tư vấn','Consultation lounge'),'aside-photo')}<span class="eyebrow" style="font-size:9px">${T('CHÚNG TÔI LẮNG NGHE','WE ARE HERE TO LISTEN')}</span><h3>${T('Điều gì khiến bạn băn khoăn?','What is on your mind?')}</h3><p>${T('Cùng bác sĩ tìm hiểu những lựa chọn phù hợp, theo nhịp của riêng bạn.','Explore suitable options with your dentist, at your own pace.')}</p>${btn(T('Trao đổi cùng Lạc Vân','Talk with Lạc Vân'),'contact')}</div><div class="aside-card"><h3>${T('Cùng tìm hiểu','Explore further')}</h3><ul class="aside-links">${services.slice(0,4).map(s=>`<li><a href="#/service/${s.id}">${serviceName(s)}</a></li>`).join('')}<li><a href="#/prices">${T('Chi phí điều trị','Treatment fees')}</a></li><li><a href="#/faq">${T('Câu hỏi thường gặp','Common questions')}</a></li></ul></div></aside>`}

]}

li>`).join('')}</ul></div></nav><nav class="mobile-nav" id="mobile-nav" hidden aria-label="${T('Điều hướng mobile','Mobile navigation')}"><ul>${nav.map(n=>`<li><details><summary>${n.title}</summary><a href="#/${n.path}">${T('Xem tổng quan','Overview')}${icon('arrow',13)}</a>${n.children.map(c=>`<a href="#/${c[1]}">${c[0]}</a>`).join('')}</details></li>`).join('')}<li><a href="#/contact">${T('Liên hệ','Contact us')}${icon('arrow',16)}</a></li><li><a href="#/search">${T('Tìm kiếm','Search')}${icon('search',16)}</a></li></ul></nav>`;
document.getElementById('floating-contact').innerHTML=`<a href="#/contact" aria-label="${T('Gửi yêu cầu tư vấn','Request a consultation')}">${icon('phone',20)}</a><a href="#/contact" aria-label="${T('Liên hệ phòng khám','Contact the clinic')}">${icon('mail',20)}</a><a href="#/locations" aria-label="${T('Tìm cơ sở','Find a clinic')}">${icon('pin',21)}</a>`;
document.getElementById('mobile-actions').innerHTML=`<a href="#/contact">${icon('calendar',21)}${T('Tư vấn','Consult')}</a><button data-search>${icon('search',21)}${T('Tìm kiếm','Search')}</button><a href="#/contact">${icon('mail',21)}${T('Gửi yêu cầu','Get in touch')}</a><a href="#/locations">${icon('pin',21)}${T('Cơ sở','Clinics')}</a>`;

function processSteps(){return `<div class="steps">${[[T('Lắng nghe','Listen'),T('Chia sẻ mong muốn, những băn khoăn và thông tin bạn đang có.','Share your goals, concerns and available information.')],[T('Thăm khám','Assess'),T('Bác sĩ giải thích các bước đánh giá và những thông tin cần tìm hiểu thêm.','Your dentist explains the assessment and any further information needed.')],[T('Cùng lập kế hoạch','Plan together'),T('Trao đổi lựa chọn, phạm vi, chi phí và thời gian trước khi quyết định.','Discuss options, scope, fees and timing before deciding.')],[T('Giữ kết nối','Stay connected'),T('Nhận hướng dẫn phù hợp và trao đổi về lịch theo dõi tiếp theo.','Receive relevant guidance and discuss the next follow-up.')]].map(x=>`<div class="step"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div>`}
function doctorsPage(){const selected=activeFilter==='all'?doctors:doctors.filter(d=>d.specialty===activeFilter);return `<section class="doctor-masthead"><div class="container"><div><span class="eyebrow">${T('NHỮNG NGƯỜI ĐỒNG HÀNH','THE PEOPLE ALONGSIDE YOU')}</span><h1>${T('Chuyên môn vững vàng.<br>Quan tâm bằng sự tận tâm.','Thoughtful expertise.<br>Care with intention.')}</h1><p>${T('Gặp gỡ những người dành thời gian lắng nghe, giải thích và cùng bạn xây dựng kế hoạch chăm sóc.','Meet the people who make time to listen, explain and plan your care together.')}</p></div><div class="team-collage">${doctors.slice(0,4).map(d=>picture(d.image,T('Bác sĩ ','Dr ')+d.name,'',true)).join('')}</div></div></section>${crumbs(T('Đội ngũ bác sĩ','Our dentists'))}<section class="section-sm"><div class="container"><div class="filter-row" aria-label="${T('Lọc chuyên môn','Filter by specialty')}">${[{id:'all',vi:'Tất cả bác sĩ',en:'All dentists'},...services].map(s=>`<button type="button" class="filter-chip${activeFilter===s.id?' active':''}" data-doctor-filter="${s.id}" aria-pressed="${activeFilter===s.id}">${T(s.vi,s.en)}</button>`).join('')}</div><div class="grid-4">${selected.map(doctorCard).join('')}</div></div></section><section class="section pale"><div class="container grid-2 align-center"><div class="copy-block"><span class="eyebrow">${T('ĐIỀU CHÚNG TÔI TRÂN TRỌNG','WHAT MATTERS TO US')}</span><h2>${T('Một người lắng nghe.<br>Một hành trình an tâm.','Someone who listens.<br>A calmer care journey.')}</h2><p>${T('Buổi hẹn không chỉ dành cho việc thăm khám. Đó còn là khoảng thời gian để bạn hiểu rõ điều đang diễn ra và cùng bác sĩ đưa ra lựa chọn.','A visit is about more than an examination. It is time to understand what is happening and make decisions with your dentist.')}</p>${btn(T('Trao đổi cùng đội ngũ','Talk with our team'),'contact')}</div><div class="editorial-panel"><p>“${T('Chúng tôi dành sự quan tâm cho cả điều bạn nói và những băn khoăn bạn chưa biết phải hỏi thế nào.','We pay attention both to what you say and to the questions you have not yet found the words for.')}”</p></div></div></section>`}
function doctorPage(id){const d=doctors.find(x=>x.id===id);if(!d)return notFound();const s=services.find(s=>s.id===d.specialty);return crumbs(T('Bác sĩ ','Dr ')+d.name,T('Đội ngũ bác sĩ','Our dentists'))+`<section class="container profile-intro"><div class="profile-portrait">${picture(d.image,T('Bác sĩ ','Dr ')+d.name,'',true)}</div><div><span class="eyebrow">${T('ĐỘI NGŨ BÁC SĨ LẠC VÂN','THE LẠC VÂN TEAM')}</span><h1>${T('Bác sĩ ','Dr ')}${d.name}</h1><p class="specialty">${doctorRole(d)}</p><p>${T(d.quoteVi,d.quoteEn)}</p><div class="profile-facts"><span>${icon('pin',17)}Lạc Vân An Nhiên</span><span>${icon('people',17)}Tiếng Việt · English</span></div>${btn(T('Trao đổi với phòng khám','Talk with the clinic'),'contact')}</div></section><nav class="profile-tabs" aria-label="${T('Nội dung hồ sơ','Profile sections')}">${[['about',T('Giới thiệu','About')],['expertise',T('Chuyên môn','Care focus')],['journey',T('Hành trình','Approach')],['articles',T('Bài viết','Journal')]].map(x=>`<a href="#${x[0]}" data-anchor="profile-${x[0]}">${x[1]}</a>`).join('')}</nav><section class="section"><div class="container article-layout"><article class="article-prose"><span class="eyebrow">${T('GẶP GỠ BÁC SĨ','MEET YOUR DENTIST')}</span><h2 id="profile-about" style="margin-top:0">${T('Lắng nghe trước khi lập kế hoạch','Listening before planning')}</h2><p>${T('Với bác sĩ '+d.name+', một buổi tư vấn có ý nghĩa bắt đầu từ việc hiểu điều khách hàng mong muốn và những điều họ còn băn khoăn. Mỗi câu hỏi là một phần quan trọng của kế hoạch chăm sóc.','For Dr '+d.name+', a meaningful consultation starts with understanding what a person wants and what they are unsure about. Every question is an important part of the care plan.')}</p><p>${T('Trong các buổi hẹn tại Lạc Vân, bác sĩ dành thời gian giải thích thông tin theo cách dễ theo dõi, trao đổi lựa chọn và thống nhất những bước tiếp theo cùng khách hàng.','During visits at Lạc Vân, the dentist makes time for accessible explanations, a discussion of the options and agreement on what comes next.')}</p><blockquote>“${T(d.quoteVi,d.quoteEn)}”</blockquote><h2 id="profile-expertise">${T('Những nội dung có thể trao đổi','What you can discuss')}</h2>${checklist([serviceName(s),T('Các bước đánh giá và thông tin cần chuẩn bị','Assessment and information to prepare'),T('Lựa chọn chăm sóc và phạm vi dự kiến','Care options and expected scope'),T('Chi phí, thời gian và lịch theo dõi','Fees, timing and follow-up')])}${picture(s.image,T('Một buổi trao đổi cùng bác sĩ','A conversation with your dentist'),'main-article-image')}<h2 id="profile-journey">${T('Cách bác sĩ đồng hành cùng bạn','How your dentist works alongside you')}</h2><div class="timeline">${[[T('Trước buổi hẹn','Before the visit'),T('Hiểu điều bạn đang quan tâm','Understand your concerns'),T('Bạn có thể gửi câu hỏi và chia sẻ những hỗ trợ cần thiết khi liên hệ phòng khám.','Share your questions and any support you may need when contacting the clinic.')],[T('Trong buổi tư vấn','During the consultation'),T('Giải thích để cùng lựa chọn','Explain and decide together'),T('Bác sĩ trao đổi các thông tin hiện có, những điều cần đánh giá thêm và các phương án có thể cân nhắc.','Discuss the information available, any further assessment and options to consider.')],[T('Sau buổi hẹn','After the visit'),T('Giữ kết nối và theo dõi','Stay connected'),T('Cùng thống nhất cách liên hệ, hướng dẫn và lịch theo dõi phù hợp với kế hoạch.','Agree on contact, guidance and follow-up appropriate to the plan.')]].map(x=>`<div><strong>${x[0]}</strong><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div></article>${aside()}</div></section><section class="section pale" id="profile-articles"><div class="container">${sectionHead(T('CÙNG HIỂU, CÙNG CHĂM SÓC','UNDERSTAND MORE, CARE BETTER'),T('Chuẩn bị thêm một chút trước buổi hẹn.','A little preparation before your visit.'))}<div class="grid-3">${articles.slice(0,3).map(articleCard).join('')}</div></div></section><section class="section"><div class="container">${sectionHead(T('ĐỘI NGŨ LẠC VÂN','THE LẠC VÂN TEAM'),T('Những người đồng hành khác','Meet more of our team'))}<div class="grid-4">${doctors.filter(x=>x.id!==d.id).slice(0,4).map(doctorCard).join('')}</div></div></section>`}
function priceGroup(s,open=false){const row=s.id==='implant'?[['Tư vấn và lập kế hoạch phục hồi','Restoration consultation & planning',T('Theo phạm vi thăm khám','According to assessment'),T('Buổi hẹn','Visit')],['Phục hồi răng mất với Implant','Implant tooth restoration',T('Từ ','From ')+s.price+' VND',T('Răng','Tooth')],['Theo dõi theo kế hoạch','Planned follow-up',T('Trao đổi trong kế hoạch','Discussed in your plan'),'—']]:s.id==='orthodontics'?[['Tư vấn kế hoạch chỉnh nha','Orthodontic consultation',T('Theo phạm vi thăm khám','According to assessment'),T('Buổi hẹn','Visit')],['Chỉnh nha theo kế hoạch cá nhân','Individual orthodontic plan',T('Từ ','From ')+s.price+' VND',T('Kế hoạch','Plan')],['Theo dõi định kỳ','Regular follow-up',T('Theo kế hoạch đã thống nhất','According to your agreed plan'),'—']]:[[s.vi,s.en,T('Từ ','From ')+s.price+' VND',s.id==='restorative'?T('Răng','Tooth'):T('Hạng mục','Item')],['Thăm khám và tư vấn lựa chọn','Examination & consultation',T('Theo phạm vi thăm khám','According to assessment'),T('Buổi hẹn','Visit')]];return `<details class="pricing-group"${open?' open':''} id="price-${s.id}"><summary>${icon(s.id==='children'?'smile':s.id==='implant'?'shield':'tooth',32)}<span><h2>${serviceName(s)}</h2><small>${T(s.tagVi,s.tagEn)} · ${T('Giá và điều kiện được giải thích trước khi thực hiện','Fees and conditions explained before proceeding')}</small></span></summary><div class="pricing-table-wrap"><table><thead><tr><th scope="col">${T('Hạng mục','Care item')}</th><th scope="col">${T('Đơn vị','Unit')}</th><th scope="col">${T('Chi phí tham khảo','Indicative fee')}</th></tr></thead><tbody>${row.map(x=>`<tr><td>${T(x[0],x[1])}<small>${T('Phạm vi được làm rõ trong kế hoạch cá nhân.','Scope is clarified in your individual plan.')}</small></td><td>${x[3]}</td><td>${x[2]}</td></tr>`).join('')}</tbody></table></div></details>`}
function pricesPage(params){const group=params.get('group');return masthead(T('RÕ RÀNG ĐỂ AN TÂM','CLARITY FOR CONFIDENCE'),T('Chi phí chăm sóc nụ cười','Care fees, clearly explained'),T('Biết rõ hạng mục, phạm vi và điều kiện trước khi cùng bác sĩ lựa chọn.','Understand the items, scope and conditions before choosing with your dentist.'))+crumbs(T('Bảng chi phí','Treatment fees'))+`<section class="section-sm"><div class="container" style="max-width:1050px"><p class="intro center" style="margin:0 auto 35px;max-width:800px">${T('Mỗi người có một nhu cầu riêng. Bảng dưới đây giúp bạn tham khảo trước; kế hoạch và chi phí cụ thể được giải thích sau khi thăm khám.','Everyone has individual needs. The information below is a starting point; your plan and fees are explained after an examination.')}</p>${services.map((s,i)=>priceGroup(s,group?s.id===group:i===0)).join('')}<div class="price-note">${T('Các mức phí là nội dung tham khảo của thương hiệu hư cấu Lạc Vân. Phạm vi thực hiện, hạng mục bổ sung và thời gian thanh toán cần được làm rõ trong kế hoạch cá nhân.','These indicative fees belong to the fictional Lạc Vân brand. Treatment scope, additional items and payment timing must be clarified in an individual plan.')}</div></div></section><section class="section pale"><div class="container">${sectionHead(T('THÊM RÕ RÀNG TRƯỚC KHI LỰA CHỌN','MORE CLARITY BEFORE YOU CHOOSE'),T('Trao đổi để hiểu trọn kế hoạch.','Talk through the complete plan.'))}<div class="grid-3">${[[T('Phạm vi bao gồm','Included scope'),T('Các bước thực hiện, vật liệu hoặc nội dung chăm sóc được bác sĩ giải thích cụ thể.','Your dentist explains the steps, materials and care included.')],[T('Những điều cần cân nhắc','Things to consider'),T('Đặt câu hỏi về lựa chọn, các bước đánh giá thêm và những chi phí có thể phát sinh.','Ask about options, further assessment and possible additional fees.')],[T('Thời gian & thanh toán','Timing & payment'),T('Thống nhất các mốc thực hiện và thông tin thanh toán trước khi function aboutPage(){return `<section class="split-hero"><div class="container"><div><span class="eyebrow">${T('CÂU CHUYỆN LẠC VÂN','THE LẠC VÂN STORY')}</span><h1>${T('Một nơi để<br>an tâm mỉm cười.','A place to<br>smile at ease.')}</h1><p>${T('Lạc là niềm vui. Vân là nét mây nhẹ nhàng. Chúng tôi chọn tên ấy như một lời nhắc: mỗi buổi hẹn nên bắt đầu bằng sự thoải mái và thấu hiểu.','Lạc evokes joy. Vân evokes the softness of clouds. Our name is a reminder that every visit should begin with comfort and understanding.')}</p>${btn(T('Gặp những người đồng hành','Meet the people alongside you'),'doctors',true)}</div><div class="story-collage">${picture('facility-reception',T('Sảnh Lạc Vân','Lạc Vân reception'),'main-photo',true)}${picture('facility-treatment-room',T('Không gian chăm sóc','Care space'),'small-photo')}</div></div></section>${crumbs(T('Về Lạc Vân','About Lạc Vân'))}<section class="section"><div class="container grid-2"><div><span class="eyebrow">${T('ĐIỀU CHÚNG TÔI TIN','WHAT WE BELIEVE')}</span><h2>${T('Chăm sóc một nụ cười.<br>Quan tâm một con người.','Care for a smile.<br>Consider the whole person.')}</h2></div><div class="copy-block"><p>${T('Đằng sau mỗi mong muốn chăm sóc răng miệng là những câu hỏi rất riêng: tôi cần chuẩn bị gì, có những lựa chọn nào, và điều gì phù hợp với cuộc sống của mình?','Behind every wish to look after a smile are personal questions: what should I prepare, what options are there, and what fits my life?')}</p><p>${T('Lạc Vân tạo một khoảng thời gian để cùng bạn đi qua những câu hỏi đó. Bác sĩ giải thích rõ, đội ngũ đón tiếp hỗ trợ chu đáo và không gian được chuẩn bị để cuộc trò chuyện diễn ra nhẹ nhàng.','Lạc Vân makes room to explore those questions together. Dentists explain clearly, the reception team supports your visit and the space is prepared for a calm conversation.')}</p></div></div></section>${values()}<section class="section"><div class="container">${sectionHead(T('TỪ SUY NGHĨ ĐẾN TỪNG CHI TIẾT','FROM INTENTION TO DETAIL'),T('Sự tận tâm hiện diện ở những điều nhỏ.','Thoughtfulness lives in the small details.'))}<div class="grid-3">${[['facility-consultation-lounge',T('Có thời gian để trò chuyện','Time to talk'),T('Một góc riêng để chia sẻ mong muốn và đặt những câu hỏi còn băn khoăn.','A quiet place to share your goals and ask the questions on your mind.')],['service-digital-planning',T('Có thông tin để lựa chọn','Information to choose'),T('Giải thích rõ các bước đánh giá, phạm vi và kế hoạch trước khi thực hiện.','Clear explanations of assessment, scope and planning before proceeding.')],['facility-treatment-room',T('Có không gian để thoải mái','Space to feel comfortable'),T('Ánh sáng, lối đi và khu chăm sóc được sắp xếp có chủ đích.','Light, circulation and care areas are thoughtfully arranged.')]].map(x=>`<article class="article-card">${picture(x[0],x[1])}<h3 style="margin:24px 0 14px">${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</div></div></section><section class="section pale"><div class="container grid-2"><div><span class="eyebrow">${T('CÁCH CHÚNG TÔI ĐỒNG HÀNH','HOW WE WORK ALONGSIDE YOU')}</span><h2>${T('Một hành trình,<br>nhiều lần được lắng nghe.','One journey.<br>Many moments to be heard.')}</h2>${picture('hero-couple',T('Khoảnh khắc an nhiên','A calm moment'),'wide-photo top-gap')}</div><div class="timeline">${[[T('Bắt đầu','Begin'),T('Hiểu điều bạn mong muốn','Understand your goals'),T('Từ câu hỏi đầu tiên, chúng tôi cùng tìm hiểu nhu cầu và những thông tin cần chuẩn bị.','From your first question, we explore your needs and what to prepare.')],[T('Cùng lựa chọn','Choose together'),T('Làm rõ từng bước','Clarify each step'),T('Các lựa chọn, phạm vi và chi phí được giải thích bằng ngôn ngữ dễ theo dõi.','Options, scope and fees are explained in accessible language.')],[T('Trong hành trình','Along the way'),T('Giữ kết nối','Stay connected'),T('Đội ngũ hỗ trợ các buổi hẹn và những câu hỏi phát sinh theo kế hoạch đã thống nhất.','The team supports visits and questions according to your agreed plan.')],[T('Chăm sóc lâu dài','Ongoing care'),T('Tạo thói quen vừa sức','Build manageable habits'),T('Hướng dẫn được trao đổi phù hợp với việc chăm sóc hằng ngày của mỗi người.','Guidance is discussed in the context of your everyday care.')]].map(x=>`<div><strong>${x[0]}</strong><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div></div></section><section class="section"><div class="container">${sectionHead(T('CON NGƯỜI LẠC VÂN','THE PEOPLE OF LẠC VÂN'),T('Sự quan tâm có một gương mặt.','Thoughtful care has a familiar face.'))}<div class="grid-4">${doctors.slice(0,4).map(doctorCard).join('')}</div><div class="section-actions">${btn(T('Gặp gỡ đội ngũ','Meet the team'),'doctors',true)}</div></div></section>${locationsPage(true)}`}
function storiesPage(){return masthead(T('ĐẰNG SAU MỖI NỤ CƯỜI','BEHIND EVERY SMILE'),T('Những câu chuyện được lắng nghe','Stories worth listening to'),T('Những câu chuyện minh họa về sự thấu hiểu, lựa chọn và hành trình chăm sóc.','Illustrative stories about understanding, choices and care.'))+crumbs(T('Câu chuyện','Stories'))+`<section class="section-sm"><div class="container"><div class="story-feature">${picture(stories[0].image,stories[0].name,'',true)}<div><span class="eyebrow">${T('CÂU CHUYỆN CỦA MAI PHƯƠNG','MAI PHUONG’S STORY')}</span><h2>${T(stories[0].titleVi,stories[0].titleEn)}</h2><blockquote>“${T(stories[0].quoteVi,stories[0].quoteEn)}”</blockquote>${btn(T('Lắng nghe câu chuyện','Explore the story'),'story/mai-phuong',true)}</div></div><div class="grid-3">${stories.slice(1).map(storyCard).join('')}</div></div></section>`+inquiry()}
function storyPage(id){const s=stories.find(s=>s.id===id);if(!s)return notFound();const service=services.find(x=>x.id===s.service);return crumbs(s.name,T('Câu chuyện','Stories'))+`<section class="section-sm"><div class="container"><div class="story-feature">${picture(s.image,s.name,'',true)}<div><span class="eyebrow">${T('CÂU CHUYỆN CỦA ','THE STORY OF ')}${s.name.toUpperCase()}</span><h1>${T(s.titleVi,s.titleEn)}</h1><blockquote>“${T(s.quoteVi,s.quoteEn)}”</blockquote><span class="pill">${serviceName(service)}</span><p class="fine top-gap">${T('Câu chuyện và nhân vật minh họa; không mô tả kết quả điều trị thực tế.','Illustrative story and fictional person; not a report of actual treatment outcomes.')}</p></div></div><div class="article-layout"><article class="article-prose"><h2 style="margin-top:0">${T('Bắt đầu từ một câu hỏi','It started with a question')}</h2><p>${T('Với '+s.name+', điều quan trọng trước buổi hẹn là hiểu rõ mình sẽ trao đổi những gì. Những câu hỏi về lựa chọn, cách chuẩn bị và thời gian cần được giải thích theo cách dễ theo dõi.','For '+s.name+', understanding what to discuss mattered before the appointment. Questions about options, preparation and timing needed clear explanations.')}</p><p>${T('Cuộc trò chuyện tại Lạc Vân bắt đầu từ mong muốn trong sinh hoạt hằng ngày. Bác sĩ dành thời gian lắng nghe, tìm hiểu thông tin hiện có và nói rõ những điều cần đánh giá thêm.','The conversation at Lạc Vân started with everyday goals. The dentist made time to listen, understand the information available and explain what needed further assessment.')}</p><h2>${T('Có thời gian để hiểu từng lựa chọn','Time to understand each option')}</h2>${picture(service.image,serviceName(service),'main-article-image')}<p>${T('Thay vì phải quyết định ngay, khách hàng có thể hỏi lại những điểm chưa rõ. Những ghi chú sau buổi tư vấn giúp việc trao đổi tiếp theo trở nên cụ thể hơn: phạm vi nào đã thống nhất, thông tin nào còn cần bổ sung và ai sẽ hỗ trợ khi có câu hỏi.','Rather than deciding immediately, the person can revisit anything unclear. Notes after the consultation make the next conversation more specific: agreed scope, information still needed and who to contact with questions.')}</p><blockquote>“${T('Khi hiểu rõ điều đang diễn ra, tôi thấy mình là một phần của kế hoạch.','Understanding what was happening helped me feel part of the plan.')}”</blockquote><h2>${T('Giữ kết nối theo cách thuận tiện','Staying connected in a convenient way')}</h2><p>${T('Kế hoạch chăm sóc được đặt trong nhịp sống của mỗi người. Phòng khám và khách hàng cùng trao đổi về buổi hẹn tiếp theo, cách liên hệ và những thông tin cần ghi nhớ.','A care plan belongs within a person’s life. The clinic and the person discuss the next visit, how to stay in touch and the information to remember.')}</p>${btn(T('Tìm hiểu dịch vụ liên quan','Explore related care'),'service/'+service.id,true)}</article>${aside()}</div></div></section><section class="section pale"><div class="container">${sectionHead(T('CÙNG LẮNG NGHE','MORE STORIES'),T('Mỗi người, một điều quan tâm.','Different people. Personal priorities.'))}<div class="grid-3">${stories.filter(x=>x.id!==s.id).map(storyCard).join('')}</div></div></section>`}
function galleryPage(){return masthead(T('KHÔNG GIAN & CON NGƯỜI','SPACES & PEOPLE'),T('Một góc nhìn gần hơn về Lạc Vân','A closer look at Lạc Vân'),T('Những khoảng sáng, những cuộc trò chuyện và sự quan tâm trong từng chi tiết.','Light-filled spaces, conversations and thoughtful details.'))+crumbs(T('Thư viện hình ảnh','Gallery'))+`<section class="section-sm"><div class="container"><div class="gallery-grid">${gallery.map((g,i)=>`<button class="gallery-tile${i===0?' large':''}" type="button" data-gallery="${i}" aria-label="${T('Phóng lớn: ','Enlarge: ')+T(g[1],g[2])}">${picture(g[0],T(g[1],g[2]))}<span>${T(g[1],g[2])}</span></button>`).join('')}</div><p class="fine center top-gap">${T('Hình ảnh và không gian hư cấu được tạo riêng cho nhận diện Lạc Vân.','Original AI-created images and fictional spaces for the Lạc Vân identity.')}</p></div></section>`}
function articlesPage(mode='knowledge',category='all'){let filter=mode==='news'?'news':mode==='category'?category:activeFilter;let filtered=articles.filter(a=>(filter==='all'||a.category===filter)&&(!articleQuery||normalize(T(a.vi,a.en)+' '+T(a.descVi,a.descEn)).includes(normalize(articleQuery))));const pages=Math.max(1,Math.ceil(filtered.length/6));articlePage=Math.min(articlePage,pages);const list=filtered.slice((articlePage-1)*6,articlePage*6);const title=mode==='news'?T('Nhịp sống Lạc Vân','Life at Lạc Vân'):mode==='category'?catName(category):T('Cùng hiểu, cùng chăm sóc','Understand more, care better');return masthead(T('BẢN TIN & KIẾN THỨC','THE LẠC VÂN JOURNAL'),title,T('Những bài viết để bạn chuẩn bị, đặt câu hỏi và chủ động hơn với việc chăm sóc.','Stories to help you prepare, ask questions and take an active part in your care.'))+crumbs(title)+`<section class="section-sm"><div class="container">${!articleQuery&&articlePage===1&&filter==='all'?`<div class="article-feature">${picture(articles[0].image,T(articles[0].vi,articles[0].en),'',true)}<div><span class="eyebrow">${T('BÀI VIẾT NỔI BẬT','FEATURED STORY')}</span><h2>${T(articles[0].vi,articles[0].en)}</h2><p>${T(articles[0].descVi,articles[0].descEn)}</p><div class="article-meta">${T('Ban biên tập Lạc Vân','Lạc Vân editorial team')} · ${T('5 phút đọc','5 minute read')}</div>${btn(T('Đọc bài viết','Read the story'),'article/implant',true)}</div></div>`:''}<div class="list-tools"><div class="filter-row" aria-label="${T('Chuyên mục','Categories')}">${categories.map(c=>`<button class="filter-chip${filter===c.id?' active':''}" data-article-filter="${c.id}" aria-pressed="${filter===c.id}">${T(c.vi,c.en)}</button>`).join('')}</div><form class="inline-search" id="article-search"><input type="search" name="q" value="${esc(articleQuery)}" placeholder="${T('Tìm bài viết…','Find a story…')}" aria-label="${T('Tìm bài viết','Find a story')}"><button class="circle-btn" aria-label="${T('Tìm kiếm','Search')}">${icon('search',18)}</button></form></div><p class="count-label">${filtered.length} ${T('bài viết','stories')}${articleQuery?' · '+T('Từ khóa: ','Search: ')+esc(articleQuery):''}</p>${list.length?`<div class="grid-3">${list.map(articleCard).join('')}</div><nav class="pagination" aria-label="${T('Phân trang bài viết','Journal pagination')}">${Array.from({length:pages},(_,i)=>`<button type="button" class="${articlePage===i+1?'active':''}" data-article-page="${i+1}" aria-current="${articlePage===i+1?'page':'false'}">${i+1}</button>`).join('')}</nav>`:emptyState()}</div></section>`}
function articlePageView(id){const a=articles.find(a=>a.id===id);if(!a)return notFound();const related=articles.filter(x=>x.id!==a.id).slice(0,3);const sections=[T('Bắt đầu từ điều bạn muốn hiểu rõ','Start with what you want to understand'),T('Chuẩn bị cho cuộc trò chuyện','Prepare for the conversation'),T('Làm rõ lựa chọn và phạm vi','Clarify options and scope'),T('Ghi lại những bước tiếp theo','Note the next steps')];return crumbs(T(a.vi,a.en),T('Kiến thức nha khoa','Dental journal'))+`<section class="section-sm"><div class="container article-layout"><article class="article-prose"><span class="eyebrow">${catName(a.category)}</span><h1>${T(a.vi,a.en)}</h1><p class="intro">${T(a.descVi,a.descEn)}</p><div class="article-meta"><span>${T('Ban biên tập Lạc Vân','Lạc Vân editorial team')}</span><span>17.10.2026</span><span>${T('5 phút đọc','5 minute read')}</span></div>${picture(a.image,T(a.vi,a.en),'main-article-image',true)}<details class="toc" open><summary>${T('Trong bài viết này','In this article')}</summary><ol>${sections.map((s,i)=>`<li><a href="#article-${i}" data-anchor="article-${i}">${s}</a></li>`).join('')}</ol></details><h2 id="article-0">${sections[0]}</h2><p>${T('Một buổi tư vấn hữu ích thường bắt đầu từ những điều rất cụ thể: điều bạn đang quan tâm, điều ảnh hưởng đến sinh hoạt và thông tin bạn muốn được giải thích. Bạn không cần tự chọn sẵn một phương pháp để có thể bắt đầu cuộc trò chuyện.','A useful consultation often starts with specific things: what is on your mind, what affects daily life and what you would like explained. You do not need to choose a treatment before starting the conversation.')}</p><p>${T('Hãy dành một ít thời gian để ghi lại những câu hỏi theo thứ tự quan trọng với mình. Có thể đó là sự thoải mái khi ăn nhai, mong muốn về nụ cười, lịch sinh hoạt hoặc cách chuẩn bị cho buổi thăm khám.','Take a little time to write down your questions in the order that matters to you. They may concern everyday comfort, your smile, your routine or preparation for the examination.')}</p><h2 id="article-1">${sections[1]}</h2><p>${T('Nếu đã có thông tin chăm sóc trước đây, bạn có thể hỏi phòng khám về những gì nên mang theo. Khi liên hệ, hãy nói rõ ngôn ngữ thuận tiện và những hỗ trợ bạn cần để buổi hẹn diễn ra nhẹ nhàng hơn.','If you have previous care information, ask the clinic what to bring. When contacting us, mention your preferred language and any support that may help you feel comfortable at your visit.')}</p>${checklist([T('Điều gì khiến tôi muốn tìm hiểu lúc này?','What has prompted me to explore care now?'),T('Tôi muốn biết thêm những lựa chọn nào?','Which options would I like to understand?'),T('Có thông tin nào cần chuẩn bị trước không?','Is there information I should prepare?'),T('Tôi sẽ trao đổi với ai nếu có câu hỏi sau buổi hẹn?','Who can I contact with questions after the visit?')])}<blockquote>${T('Bạn có thể hỏi lại. Hiểu rõ là một phần quan trọng của việc cùng lựa chọn.','It is fine to ask again. Understanding is an important part of choosing together.')}</blockquote><h2 id="article-2">${sections[2]}</h2><p>${T('Trong buổi tư vấn, hãy đề nghị giải thích phạm vi của từng lựa chọn, những bước cần đánh giá thêm và thông tin chi phí. Một bảng giá trên website giúp tham khảo ban đầu, nhưng không thay thế cho kế hoạch được trao đổi sau khi thăm khám.','During the consultation, ask about the scope of each option, any further assessment and fee information. Website prices are an initial reference, not a substitute for a plan discussed after an examination.')}</p><figure>${picture('service-digital-planning',T('Trao đổi kế hoạch chăm sóc','Discussing a care plan'))}<figcaption>${T('Kế hoạch được giải thích theo thông tin và nhu cầu của mỗi người.','A plan is explained in the context of each person’s needs and information.')}</figcaption></figure><p>${T('Bạn cũng có thể hỏi về các mốc thời gian và cách theo dõi. Nếu có điều gì chưa rõ, hãy ghi lại để trao đổi tiếp thay vì cảm thấy cần quyết định ngay.','You can also ask about timing and follow-up. If something remains unclear, note it for another conversation rather than feeling you must decide immediately.')}</p><h2 id="article-3">${sections[3]}</h2><p>${T('Trước khi kết thúc, cùng phòng khám xác nhận những thông tin đã thống nhất: buổi hẹn tiếp theo, cách liên hệ và những điều cần chuẩn bị. Những ghi chú ngắn sẽ giúp bạn chủ động hơn khi quay lại.','Before leaving, confirm the agreed details with the clinic: the next visit, contact information and any preparation. A few short notes can help you feel more prepared when you return.')}</p><div class="price-note">${T('Bài viết cung cấp thông tin chuẩn bị và trao đổi chung. Tình trạng cụ thể cần được bác sĩ đánh giá trong buổi thăm khám.','This article offers general information about preparation and discussion. Individual circumstances need assessment by a dentist.')}</div><div class="article-author">${picture('doctor-minh-an',T('Bác sĩ Lê Minh An','Dr Le Minh An'))}<div><small>${T('CÙNG TRAO ĐỔI VỚI ĐỘI NGŨ','TALK WITH OUR TEAM')}</small><strong>${T('Mỗi câu hỏi đều đáng được lắng nghe.','Every question deserves to be heard.')}</strong><br>${link(T('Gặp đội ngũ bác sĩ','Meet the dentists'),'doctors')}</div></div></article>${aside()}</div></section><section class="section pale"><div class="container">${sectionHead(T('CÙNG TÌM HIỂU THÊM','EXPLORE FURTHER'),T('Có thể bạn cũng quan tâm','You may also like'))}<div class="grid-3">${related.map(articleCard).join('')}</div></div></section>`}
function promotionsPage(){return masthead(T('THÊM MỘT DỊP QUAN TÂM','MAKE TIME FOR CARE'),T('Dành thời gian cho nụ cười','Make time for your smile'),T('Tìm hiểu nội dung, thời gian và điều kiện của các chương trình tại Lạc Vân.','Explore programme details, dates and conditions at Lạc Vân.'))+crumbs(T('Chương trình','Programmes'))+`<section class="section-sm"><div class="container"><div class="campaign-banner"><div><span class="pill">${T('Chương trình chăm sóc','Care programme')}</span><h2>${T('Một buổi hẹn.<br>Thêm sự quan tâm.','One visit.<br>A little more care.')}</h2><p class="intro">${T('Dành một khoảng thời gian để cả gia đình cùng tìm hiểu việc chăm sóc răng miệng.','Make a little time for the whole family to explore dental care.')}</p><p class="article-meta">01.10–31.12.2026</p>${btn(T('Tìm hiểu chương trình','Explore the programme'),'promotion/family')}</div>${picture('hero-family',T('Gia đình cùng mỉm cười','A family sharing a smile'),' ',true)}</div></div></section><section class="section pale"><div class="container grid-3">${[['hero-couple',T('Cùng nhau chăm sóc','Care together')],['hero-wellbeing',T('Một khoảng thời gian cho bạn','A little time for yourself')],['facility-consultation-lounge',T('Bắt đầu từ một cuộc trò chuyện','Start with a conversation')]].map(x=>`<article class="article-card">${picture(x[0],x[1])}<span class="tag">${T('TÌM HIỂU TẠI PHÒNG KHÁM','EXPLORE WITH THE CLINIC')}</span><h3>${x[1]}</h3><p>${T('Trao đổi về nội dung phù hợp với mong muốn và thời gian của bạn.','Discuss care that fits your goals and your time.')}</p>${link(T('Trao đổi với Lạc Vân','Talk with Lạc Vân'),'contact')}</article>`).join('')}</div></section>`}
function promotionPage(){return crumbs(T('Cùng gia đình chăm sóc nụ cười','Family care programme'),T('Chương trình','Programmes'))+`<section class="section-sm"><div class="container"><div class="campaign-banner"><div><span class="eyebrow">${T('CÙNG GIA ĐÌNH, CÙNG QUAN TÂM','FAMILY TIME, THOUGHTFUL CARE')}</span><h1>${T('Một buổi hẹn.<br>Thêm sự quan tâm.','One visit.<br>A little more care.')}</h1><p>${T('Tìm hiểu cách chuẩn bị một buổi thăm khám phù hợp cho các thành viên trong gia đình.','Explore how to prepare a visit that suits the members of your family.')}</p><div class="article-meta">01.10–31.12.2026 · Asia/Ho_Chi_Minh</div>${btn(T('Trao đổi về chương trình','Ask about the programme'),'contact')}</div>${picture('hero-family',T('Thời gian cùng gia đình','Time with family'),' ',true)}</div><div class="campaign-benefit">${[['people',T('Cùng chuẩn bị','Prepare together'),T('Trao đổi nhu cầu của từng thành viên.','Discuss each family member’s needs.')],['calendar',T('Cùng sắp xếp','Plan together'),T('Tìm thời gian thuận tiện cho buổi hẹn.','Find a convenient time to visit.')],['book',T('Cùng tìm hiểu','Learn together'),T('Nhận thông tin phù hợp sau khi đánh giá.','Receive relevant information after assessment.')]].map(x=>`<div>${icon(x[0],27)}<strong>${x[1]}</strong><p>${x[2]}</p></div>`).join('')}</div></div></section><section class="section"><div class="container article-layout"><article class="article-prose"><h2 style="margin-top:0">${T('Nội dung chương trình','Programme details')}</h2><p>${T('Phòng khám dành thời gian trao đổi để hiểu nhu cầu, lứa tuổi và những điều gia đình đang quan tâm. Từng thành viên được tư vấn theo tình trạng và thông tin riêng.','The clinic makes time to understand the family’s needs, ages and concerns. Each person’s discussion is based on their own circumstances and information.')}</p><h2>${T('Điều kiện và phạm vi','Conditions and scope')}</h2>${checklist([T('Liên hệ phòng khám để trao đổi và sắp xếp trước.','Contact the clinic to discuss and arrange your visit.'),T('Yêu cầu tư vấn chưa phải lịch hẹn đã xác nhận.','A consultation request is not a confirmed appointment.'),T('Chi phí, hạng mục và thời gian được giải thích theo từng kế hoạch.','Fees, items and timing are explained for each plan.'),T('Không có cam kết kết quả điều trị hoặc ưu đãi tài chính mặc định.','No treatment outcome or default financial offer is promised.')])}<h2>${T('Các bước tham gia','How to get started')}</h2><p>${T('Gửi yêu cầu với kênh liên hệ thuận tiện. Đội ngũ sẽ trao đổi về số người, cơ sở mong muốn và thời gian phù hợp trước khi xác nhận.','Send a request with a convenient contact method. Our team will discuss the number of people, preferred clinic and suitable timing before confirming.')}</p>${btn(T('Kết nối cùng Lạc Vân','Connect with Lạc Vân'),'contact')}</article>${aside()}</div></section>`}
function locationsPage(embedded=false){return `${embedded?'':masthead(T('GẦN BẠN HƠN','CLOSER TO YOU'),T('Không gian Lạc Vân','The Lạc Vân spaces'),T('Ba không gian, cùng một sự quan tâm.','Three spaces. One thoughtful approach.'))+crumbs(T('Hệ thống cơ sở','Our clinics'))}<section class="section${embedded?' pale':''}"><div class="container">${embedded?sectionHead(T('KHÔNG GIAN CỦA BẠN','YOUR SPACE'),T('Một khoảng an nhiên, gần bạn hơn.','A calmer space, closer to you.')):''}<div class="grid-3">${locations.map(locationCard).join('')}</div></div></section>`}

function reviewContent(){document.getElementById('review-title').textContent=T('Lạc Vân · Các trang thiết kế','Lạc Vân · Explore the design');document.getElementById('review-content').innerHTML=`<p class="review-note">${T('Bản HTML độc lập để review thiết kế. Nội dung, hình ảnh và tương tác ở đây là dữ liệu trình bày; chưa kết nối CMS. Biểu mẫu không gửi hoặc lưu thông tin.','A standalone HTML design proposal. Content, images and interactions are presentation data, not connected to the CMS. Forms do not send or store information.')}</p><div class="review-grid">${reviewRoutes.map((x,i)=>`<a href="#/${x[0]}" data-review-route>${icon(i===1?'cloud':i===30?'info':'arrow',16)}${T(x[1],x[2])}</a>`).join('')}</div><p class="fine top-gap">${T('Có thể xem VI/EN bằng nút ngôn ngữ trên header. Logo và bộ màu nằm ở trang “Logo & nhận diện”.','Use the header language switch for VI/EN. Explore the logo and colours on the “Logo & identity” page.')}</p>`}
function render(keepScroll=false){const drafts=keepScroll?Array.from(document.querySelectorAll('form.prototype-form')).map(f=>Array.from(f.elements).filter(e=>e.name).map(e=>({name:e.name,value:e.value,checked:e.checked,index:e.tagName==='SELECT'?e.selectedIndex:null}))):[];clearInterval(heroTimer);const oldY=window.scrollY;const raw=(location.hash.replace(/^#\/?/,'')||'home');const parts=raw.split('?');currentRoute=parts[0]||'home';const params=new URLSearchParams(parts.slice(1).join('?'));const [kind,id]=currentRoute.split('/');let html;
switch(kind){case'home':html=home();break;case'services':html=servicesPage();break;case'service':html=servicePage(id);break;case'doctors':html=doctorsPage();break;case'doctor':html=doctorPage(id);break;case'prices':html=pricesPage(params);break;case'about':html=aboutPage();break;case'stories':html=storiesPage();break;case'story':html=storyPage(id);break;case'gallery':html=galleryPage();break;case'knowledge':html=articlesPage();break;case'news':html=articlesPage('news');break;case'category':html=articlesPage('category',id);break;case'article':html=articlePageView(id);break;case'promotions':html=promotionsPage();break;case'promotion':html=id==='family'?promotionPage():notFound();break;case'contact':html=contactPage();break;case'locations':html=locationsPage();break;case'location':html=locationPage(id);break;case'search':html=searchPage(params);break;case'faq':html=faqPage();break;case'privacy':case'visit':case'aftercare':html=ancillaryPage(kind);break;case'identity':html=identityPage();break;case'states':html=statesPage();break;default:html=notFound()}
document.documentElement.lang=locale;document.getElementById('main-content').innerHTML=html;header();footer();reviewContent();document.querySelector('.skip').textContent=T('Đến nội dung chính','Skip to main content');document.querySelector('.skip').href='#main-content';document.querySelectorAll('[data-close]').forEach(b=>b.setAttribute('aria-label',T('Đóng','Close')));document.getElementById('notice-title').textContent=T('Thông tin bản thiết kế','About this design');document.getElementById('search-title').textContent=T('Tìm điều bạn quan tâm','What is on your mind?');document.title=(reviewRoutes.find(x=>x[0]===currentRoute)?.[locale==='vi'?1:2]||T('Chăm sóc nụ cười','Care for your smile'))+' | '+T('Nha khoa Lạc Vân','Lac Van Dental');
if(keepScroll)document.querySelectorAll('form.prototype-form').forEach((f,i)=>(drafts[i]||[]).forEach(v=>{const e=f.elements.namedItem(v.name);if(!e)return;if(v.index!==null)e.selectedIndex=v.index;else e.value=v.value;if(e.type==='checkbox')e.checked=v.checked}));if(!keepScroll)window.scrollTo({top:0,behavior:'instant'});else window.scrollTo({top:oldY,behavior:'instant'});
if(kind==='home'&&!heroPaused&&!matchMedia('(prefers-reduced-motion: reduce)').matches){heroTimer=setInterval(()=>{if(document.hidden||document.querySelector('dialog[open]')||document.activeElement?.matches('input,select,textarea'))return;setSlide((heroIndex+1)%3)},7000)}
}
function setSlide(index){heroIndex=(index+3)%3;const oldHero=document.querySelector('.hero');if(!oldHero||currentRoute!=='home')return;const template=document.createElement('template');template.innerHTML=home();const newHero=template.content.querySelector('.hero');oldHero.replaceWith(newHero)}
function showDialog(id){const d=document.getElementById(id);lastDialogTrigger=document.activeElement;if(!d.open)d.showModal()}
function closeDialog(d){d.close();if(lastDialogTrigger instanceof HTMLElement&&lastDialogTrigger.isConnected)lastDialogTrigger.focus()}
function openSearch(){document.getElementById('search-content').innerHTML=`<form class="search-big" id="dialog-search" style="margin:0;max-width:none"><input name="q" type="search" maxlength="160" placeholder="${T('Dịch vụ, bác sĩ, điều bạn quan tâm…','Care, dentists, things on your mind…')}" aria-label="${T('Từ khóa tìm kiếm','Search terms')}" required><button class="btn">${T('Tìm kiếm','Search')}${icon('search',17)}</button></form><div class="filter-row top-gap">${['Implant',T('Gia đình','Family'),T('Chăm sóc','Care')].map(term=>`<a class="filter-chip" href="#/search?q=${encodeURIComponent(term)}" data-review-route>${term}</a>`).join('')}</div>`;showDialog('search-dialog');document.querySelector('#dialog-search input').focus()}
function showGallery(index){galleryIndex=(index+gallery.length)%gallery.length;const g=gallery[galleryIndex];const img=document.getElementById('lightbox-image');img.src=asset(g[0]);img.alt=T(g[1],g[2]);document.getElementById('lightbox-caption').textContent=(galleryIndex+1)+' / '+gallery.length+' · '+T(g[1],g[2]);document.getElementById('gallery-prev').setAttribute('aria-label',T('Ảnh trước','Previous image'));document.getElementById('gallery-next').setAttribute('aria-label',T('Ảnh tiếp','Next image'));if(!document.getElementById('lightbox-dialog').open)showDialog('lightbox-dialog')}
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;
if(b.matches('[data-close]')){closeDialog(b.closest('dialog'));return}
if(b.id==='review-toggle'){reviewContent();showDialog('review-dialog');return}
if(b.matches('[data-review-route]')){const d=b.closest('dialog');if(d)closeDialog(d);return}
if(b.matches('[data-search]')){openSearch();return}
if(b.matches('[data-locale]')){if(locale!==b.dataset.locale){locale=b.dataset.locale;render(true)}return}
if(b.id==='mobile-toggle'){const nav=document.getElementById('mobile-nav');nav.hidden=!nav.hidden;b.setAttribute('aria-expanded',String(!nav.hidden));b.setAttribute('aria-label',nav.hidden?T('Mở menu','Open navigation'):T('Đóng menu','Close navigation'));b.innerHTML=icon(nav.hidden?'menu':'close',21);return}
if(b.matches('[data-menu]')){const item=b.closest('.nav-item');const open=!item.classList.contains('open');document.querySelectorAll('.nav-item.open').forEach(n=>{n.classList.remove('open');n.querySelector('.nav-trigger').setAttribute('aria-expanded','false')});item.classList.toggle('open',open);b.setAttribute('aria-expanded',String(open));return}
if(b.matches('[data-anchor]')){e.preventDefault();document.getElementById(b.dataset.anchor)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth',block:'start'});return}
if(b.matches('[data-slide]')){const action=b.dataset.slide;if(action==='pause'){heroPaused=!heroPaused;render(true)}else setSlide(action==='prev'?heroIndex-1:action==='next'?heroIndex+1:Number(action));return}
if(b.matches('[data-doctor-filter]')){activeFilter=b.dataset.doctorFilter;render(true);return}
if(b.matches('[data-article-filter]')){activeFilter=b.dataset.articleFilter;articlePage=1;articleQuery='';const target=activeFilter==='all'?'knowledge':'category/'+activeFilter;if(currentRoute!==target){location.hash='/'+target}else render(true);return}
if(b.matches('[data-article-page]')){articlePage=Number(b.dataset.articlePage);render(true);document.querySelector('.list-tools')?.scrollIntoView({behavior:'smooth',block:'start'});return}
if(b.matches('[data-gallery]')){showGallery(Number(b.dataset.gallery));return}
if(b.id==='gallery-prev'){showGallery(galleryIndex-1);return}if(b.id==='gallery-next'){showGallery(galleryIndex+1);return}
if(b.matches('[data-state-retry]')){const result=b.parentElement.querySelector('[data-retry-result]');result.hidden=false;result.textContent=T('Đây là trạng thái mô phỏng; không có yêu cầu mạng được gửi.','This is a simulated state; no network request was made.');return}
if(b.matches('.skip')){e.preventDefault();document.getElementById('main-content').focus();return}
if(b.matches('a[href^="#/"]')&&b.getAttribute('href')===location.hash){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'})}
});
document.addEventListener('submit',e=>{const f=e.target;if(f.matches('.prototype-form')){e.preventDefault();const result=f.querySelector('.form-result');if(f.dataset.form!=='compact'&&!f.elements.phone.value.trim()&&!f.elements.email.value.trim()){result.hidden=false;result.textContent=T('Vui lòng nhập số điện thoại hoặc email để xem trạng thái biểu mẫu.','Enter a phone number or email to preview the form state.');f.elements.phone.focus();return}result.hidden=false;result.textContent=T('Bạn đang xem bản thiết kế HTML. Thông tin chưa được gửi đến phòng khám và không được lưu.','You are viewing the HTML design. Your information was not sent to the clinic and has not been stored.');return}
if(f.id==='article-search'){e.preventDefault();articleQuery=new FormData(f).get('q').trim();articlePage=1;render(true);return}
if(f.id==='site-search'||f.id==='dialog-search'){e.preventDefault();const q=new FormData(f).get('q').trim();const d=f.closest('dialog');if(d)closeDialog(d);const next='/search?q='+encodeURIComponent(q);if(location.hash==='#'+next)render();else location.hash=next;return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const nav=document.getElementById('mobile-nav');if(nav&&!nav.hidden){nav.hidden=true;const b=document.getElementById('mobile-toggle');b.setAttribute('aria-expanded','false');b.setAttribute('aria-label',T('Mở menu','Open navigation'));b.innerHTML=icon('menu',21);b.focus()}document.querySelectorAll('.nav-item.open').forEach(n=>{n.classList.remove('open');n.querySelector('button').setAttribute('aria-expanded','false')})}if(document.getElementById('lightbox-dialog').open){if(e.key==='ArrowRight'){e.preventDefault();showGallery(galleryIndex+1)}if(e.key==='ArrowLeft'){e.preventDefault();showGallery(galleryIndex-1)}}});
document.querySelectorAll('dialog').forEach(d=>{d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog(d)}});d.addEventListener('close',()=>{if(lastDialogTrigger instanceof HTMLElement&&lastDialogTrigger.isConnected)lastDialogTrigger.focus()})});
window.addEventListener('hashchange',()=>{const next=location.hash.replace(/^#\/?/,'').split('?')[0]||'home';if(next!==currentRoute){activeFilter='all';articlePage=1;articleQuery=''}document.querySelectorAll('dialog[open]').forEach(d=>d.close());render();document.getElementById('main-content').focus({preventScroll:true})});
render();
</script>
</body>
</html>
